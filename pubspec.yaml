name: mywork
description: "MyWork — application mobile candidats et recruteurs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Uploads (CV, documents, photos)
  file_picker: ^13.1.0
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Local device state
  shared_preferences: ^2.3.3

  # Small UX utilities
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  uuid: ^4.6.0

  # Social sign-in
  # Pinned to the pre-Credential-Manager legacy API (7.x's Credential
  # Manager-based flow hits a widely-reported, unresolved upstream bug —
  # GoogleSignInException [28444] "Developer console is not set up
  # correctly" — that fires right after account selection even with a
  # verified-correct Cloud Console setup: github.com/flutter/flutter/issues,
  # ionic-team/capacitor#8444, Cap-go/capacitor-social-login#422).
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  mocktail: ^1.0.5
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash.png"
  color_dark: "#060B18"
  image_dark: "assets/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/splash.png"
    color_dark: "#060B18"
    image_dark: "assets/splash.png"
